<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#9c3f27">

<title>Nasz pamiętnik</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#f2e8d0; --paper2:#fbf5e6; --ink:#3a2e28; --muted:#7d6b5d;
  --accent:#9c3f27; --line:#c8b38a; --shadow:0 2px 7px rgba(60,40,20,.28);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:radial-gradient(rgba(120,90,50,.08) 1px,transparent 1px),radial-gradient(rgba(120,90,50,.05) 1px,transparent 1px);
  background-size:23px 23px,37px 37px; background-position:0 0,11px 17px;
  font-family:'Lora',Georgia,serif; line-height:1.55; min-height:100vh;
}
h1,h2,h3,.hand{font-family:'Caveat','Segoe Script',cursive;font-weight:700;margin:0}
a{color:var(--accent)}
.wrap{max-width:920px;margin:0 auto;padding:8px 16px 60px}
header.top{max-width:920px;margin:0 auto;padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:2.1rem;text-decoration:none;color:var(--accent)}
.who{display:flex;gap:14px;align-items:center;font-size:.9rem}
button.link{background:none;border:0;color:var(--muted);cursor:pointer;font:inherit;padding:4px;text-decoration:underline}
.btn{font-family:'Caveat',cursive;font-weight:700;font-size:1.35rem;background:var(--accent);color:#fff8ea;border:2px solid var(--accent);padding:.25em 1em;border-radius:4px;cursor:pointer;box-shadow:var(--shadow)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--accent);box-shadow:none}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0}
.big{font-size:1.8rem}
.muted{color:var(--muted)}
.err{color:#a11;background:#fdecea;padding:10px 14px;border-radius:4px}

/* kafelki wyjazdów */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px;margin-top:22px}
.tile{display:block;background:#fffdf7;padding:10px 10px 14px;box-shadow:var(--shadow);text-decoration:none;color:inherit;transform:rotate(var(--r,0deg));transition:transform .15s}
.tile:hover{transform:rotate(0) scale(1.03)}
.tile .cover{width:100%;aspect-ratio:4/3;object-fit:cover;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e6d3a8,#d5b98a);color:#fff8ea;font-family:'Caveat',cursive;font-size:4rem}
.tile h3{font-size:1.75rem;margin-top:8px;line-height:1.1}
.tile .sub{font-size:.9rem;color:var(--muted)}

/* nagłówek wyjazdu */
.back{display:inline-block;margin:14px 0 6px;text-decoration:none}
.trip-head{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.trip-head .cover{width:150px;aspect-ratio:4/3;object-fit:cover;background:#fff;padding:6px 6px 18px;box-shadow:var(--shadow);transform:rotate(-2deg)}
.trip-head h1{font-size:3rem;line-height:1}
.trip-head .sub{color:var(--muted)}
.trip-actions{margin-top:8px;display:flex;gap:10px}

/* oś czasu */
.timeline{position:relative;margin:26px 0 40px 16px;padding-left:28px;border-left:3px dashed var(--line)}
.year{display:inline-block;font-family:'Caveat',cursive;font-weight:700;font-size:1.9rem;line-height:1.2;background:var(--accent);color:#fff8ea;padding:0 14px;transform:rotate(-2deg);margin:10px 0 14px -14px;box-shadow:var(--shadow)}
.entry{position:relative;margin:0 0 30px}
.entry::before{content:'';position:absolute;left:-37px;top:16px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--paper)}
.note{background:var(--paper2);padding:14px 18px 16px;box-shadow:var(--shadow);border-radius:2px;position:relative}
.note::after{content:'';position:absolute;top:-9px;left:24px;width:70px;height:18px;background:rgba(220,200,150,.65);transform:rotate(-3deg)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.date{font-family:'Caveat',cursive;font-weight:700;font-size:1.6rem;color:var(--accent)}
.by{font-family:'Caveat',cursive;font-size:1.3rem;color:var(--muted)}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0 0}
.photos{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.photos figure{margin:0;background:#fff;padding:6px 6px 20px;box-shadow:var(--shadow);transform:rotate(var(--r,0deg));cursor:zoom-in}
.photos img{display:block;height:130px;width:auto;max-width:100%;min-width:90px;object-fit:cover}
.entry-actions{margin-top:8px;display:flex;gap:12px;font-size:.85rem}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}

/* okna i formularze */
.overlay{position:fixed;inset:0;background:rgba(40,28,20,.55);display:flex;justify-content:center;overflow:auto;padding:16px;z-index:50}
.modal{background:var(--paper2);width:100%;max-width:540px;padding:20px;box-shadow:0 6px 24px rgba(0,0,0,.4);margin:auto;border-radius:3px}
.modal h2{font-size:2.1rem;color:var(--accent);margin-bottom:8px}
label{display:block;margin:12px 0 4px;font-size:.92rem;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);padding:9px 10px;border:1px solid var(--line);background:#fffdf7;border-radius:3px}
textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:12px}
.row>label{flex:1}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;align-items:center;flex-wrap:wrap}
.status{margin-right:auto;font-size:.9rem;color:var(--muted)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.thumb{position:relative}
.thumb img{width:84px;height:84px;object-fit:cover;display:block;border:3px solid #fff;box-shadow:var(--shadow)}
.thumb button{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.center-card{max-width:400px;margin:12vh auto 0;background:var(--paper2);padding:28px 24px;box-shadow:var(--shadow);text-align:center;transform:rotate(-1deg)}
.center-card h1{font-size:2.8rem;color:var(--accent)}
.center-card form{text-align:left}

/* powiększanie zdjęć */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:100}
.lb img{max-width:94vw;max-height:88vh;box-shadow:0 0 30px #000}
.lb button{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:0;font-size:2rem;cursor:pointer;width:52px;height:52px;border-radius:50%}
.lb .x{top:14px;right:14px;font-size:1.4rem}
.lb .prev{left:10px}.lb .next{right:10px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#3a2e28;color:#fff8ea;padding:10px 18px;border-radius:4px;z-index:200;max-width:90vw}
@media (max-width:520px){.row{flex-direction:column;gap:0}.trip-head h1{font-size:2.4rem}}
.fld.two{display:flex;gap:8px}
.fld.two select{flex:1;min-width:0}
.edited{font-size:.82rem;color:var(--muted);font-style:italic;margin-top:2px}

:root{--chip-fg:#7a2f1c;--chip-bd:#c8b38a;--chip-bw:1.5px;--chip-bg:linear-gradient(#fffdf6,#f6ead0);--chip-sh:0 1px 0 rgba(255,255,255,.95) inset,0 2px 5px rgba(80,50,20,.2);
 --chip-hbg:#9c3f27;--chip-hfg:#fff8ea;--chip-hsh:0 5px 12px rgba(80,50,20,.3);--chip-focus:#e8b45c;
 --dng:#a3261d;--dng-bd:#e0a8a2;--dng-h:#a3261d;--mk1:rgba(255,218,28,.86);--mk2:rgba(255,160,120,.66)}
.chip:hover{border-color:#9c3f27}
.chip.danger:hover{border-color:#a3261d}

/* ===== chipsy, zakreślacz, układ przycisków ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em}
.btn .ic{width:19px;height:19px;stroke-width:2.6}
.chip{display:inline-flex;align-items:center;gap:.5em;font-family:inherit;font-weight:700;font-size:.85rem;line-height:1;letter-spacing:.03em;padding:.65em 1.1em;border-radius:99px;cursor:pointer;text-decoration:none;white-space:nowrap;
  color:var(--chip-fg);background:var(--chip-bg);border:var(--chip-bw) solid var(--chip-bd);box-shadow:var(--chip-sh);transition:transform .12s,box-shadow .12s,background .15s,color .15s}
.chip:hover{transform:translateY(-1px);background:var(--chip-hbg);color:var(--chip-hfg);box-shadow:var(--chip-hsh)}
.chip:active{transform:translateY(0)}
.chip:focus-visible{outline:3px solid var(--chip-focus);outline-offset:2px}
.chip .ic{flex:0 0 auto}
.chip.big{font-size:1.02rem;padding:.78em 1.4em;gap:.55em}
.chip.big .ic{width:20px;height:20px}
.chip.sm{font-size:.78rem;padding:.55em .95em}
.chip.danger{--chip-fg:var(--dng);--chip-bd:var(--dng-bd);--chip-hbg:var(--dng-h);--chip-hfg:#fff}
.who{gap:8px}
.who .chip{font-size:.8rem;padding:.55em 1em}
.back{margin:14px 0 6px}
.trip-actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.entry-actions{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.bar{flex-wrap:nowrap;gap:10px}
.bar .btn{flex:1 1 auto;white-space:nowrap}
.bar .chip{flex:0 0 auto}
.trip-head h1{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--ink);line-height:1.15}
.trip-head .sub{margin-top:10px;font-size:1.05rem;font-weight:700}
.mk{background-image:linear-gradient(100deg,transparent 0,var(--mk1) 2%,var(--mk1) 98%,transparent 100%);padding:.04em .32em;margin:0 -.1em;border-radius:.5em .15em .45em .2em / .3em .2em .35em .2em;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:var(--ink)}
.mk.mk2{background-image:linear-gradient(100deg,transparent 0,var(--mk2) 2%,var(--mk2) 98%,transparent 100%);display:inline-block;transform:rotate(-.8deg);padding:.12em .5em}
@media (max-width:380px){.bar .btn{font-size:1.15rem;padding:.25em .7em}.bar .chip.big{padding:.7em 1em;font-size:.9rem}.chip.big{font-size:.95rem}}
.bar .btn{font-size:clamp(1.1rem,4.8vw,1.4rem);padding:.25em .85em}
.bar .chip.big{padding:.72em 1.05em;font-size:.92rem}
@media (max-width:380px){.bar .chip .lbl{display:none}.bar .chip.big{padding:.78em .95em}}
</style>

<body>
<div id="app"></div>

<script>
/* ============ USTAWIENIA: uzupełnij po założeniu Supabase ============ */
const CONFIG = {
  TITLE: 'Nasz pamiętnik',
  SUPABASE_URL: 'https://kgsvqerhqqiheyrrfjra.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_OQomYCfXV1kTBRLTra2RSQ_JZrnEELd',
  SHARED_EMAIL: 'pamietnik@wyjazdy.com'   // ten sam e-mail, który wpiszesz przy tworzeniu konta w Supabase
};
/* ===================================================================== */

document.title = CONFIG.TITLE;
const app = document.getElementById('app');
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const notConfigured = CONFIG.SUPABASE_URL.startsWith('WKLEJ') || CONFIG.SUPABASE_ANON_KEY.startsWith('WKLEJ');
const sb = notConfigured ? null : supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);

let author = '';
try { author = localStorage.getItem('pam_author') || ''; } catch (e) {}
let tripsAsc = true;
let memAsc = true;

/* ---------- daty ---------- */
const MONTHS = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
function parts(d){ const [y,m,dd] = d.split('-').map(Number); return {y, m, d: dd}; }
function fmtDate(d, prec){
  if (!d) return '';
  const p = parts(d);
  if (prec === 'year') return String(p.y);
  if (prec === 'month') return `${MONTHS[p.m-1]} ${p.y}`;
  return `${p.d} ${MONTHS_GEN[p.m-1]} ${p.y}`;
}
function fmtRange(a, b, prec){
  const x = fmtDate(a, prec);
  if (!b || b === a) return x;
  return `${x} – ${fmtDate(b, prec)}`;
}
function fromInputVal(v, prec){
  if (!v) return null;
  if (prec === 'year') return /^\d{4}$/.test(v) ? v + '-01-01' : null;
  if (prec === 'month') return /^\d{4}-\d{2}$/.test(v) ? v + '-01' : null;
  return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
}
const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; };

/* wybór daty z poziomem dokładności (dzień / miesiąc / rok); rok i miesiąc wybierane z listy */
const YEAR_MAX = new Date().getFullYear() + 1, YEAR_MIN = 1930;
function opt(value, label){ const o = document.createElement('option'); o.value = value; o.textContent = label; return o; }
function buildField(prec, val, optional){
  const el = document.createElement('div');
  if (!optional && !val) val = todayStr();
  if (prec === 'day'){
    const inp = document.createElement('input'); inp.type = 'date'; inp.value = val || '';
    el.appendChild(inp);
    return { el, get: () => fromInputVal(inp.value, 'day') };
  }
  const p = val ? parts(val) : null;
  const ys = document.createElement('select');
  if (optional) ys.appendChild(opt('', 'rok'));
  const years = [];
  for (let y = YEAR_MAX; y >= YEAR_MIN; y--) years.push(y);
  if (p && !years.includes(p.y)){ years.push(p.y); years.sort((a, b) => b - a); }
  years.forEach(y => ys.appendChild(opt(String(y), String(y))));
  ys.value = p ? String(p.y) : '';
  if (prec === 'year'){
    el.appendChild(ys);
    return { el, get: () => ys.value ? ys.value + '-01-01' : null };
  }
  const ms = document.createElement('select');
  if (optional) ms.appendChild(opt('', 'miesiąc'));
  MONTHS.forEach((n, i) => ms.appendChild(opt(String(i + 1), n)));
  ms.value = p ? String(p.m) : '';
  el.className = 'fld two';
  el.appendChild(ms); el.appendChild(ys);
  return { el, get: () => (ys.value && ms.value) ? `${ys.value}-${String(ms.value).padStart(2, '0')}-01` : null };
}
function makeDatePicker({date = null, end = null, prec = 'day', withEnd = false} = {}){
  const el = document.createElement('div');
  el.innerHTML = `
    <label>Dokładność daty
      <select class="prec">
        <option value="day">Dokładna data</option>
        <option value="month">Miesiąc i rok</option>
        <option value="year">Tylko rok</option>
      </select>
    </label>
    <div class="row">
      <label>${withEnd ? 'Od' : 'Data'}<div class="slot1"></div></label>
      ${withEnd ? '<label>Do (opcjonalnie)<div class="slot2"></div></label>' : ''}
    </div>`;
  const sel = $('.prec', el), s1 = $('.slot1', el), s2 = $('.slot2', el);
  let cur1 = date, cur2 = end, curPrec = prec, f1, f2;
  function paint(){
    f1 = buildField(curPrec, cur1, false); s1.replaceChildren(f1.el);
    if (s2){ f2 = buildField(curPrec, cur2, true); s2.replaceChildren(f2.el); }
  }
  sel.value = prec; paint();
  sel.onchange = () => {
    cur1 = f1.get() || cur1;
    if (f2) cur2 = f2.get();
    curPrec = sel.value; paint();
  };
  return { el, get: () => ({ date: f1.get(), end: f2 ? f2.get() : null, prec: curPrec }) };
}

/* ---------- zdjęcia ---------- */
async function resizeImage(file, max = 1600, quality = 0.8){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Nie udało się przetworzyć zdjęcia')), 'image/jpeg', quality));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadImage(file, folder){
  const blob = await resizeImage(file);
  const path = `${folder}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return path;
}
async function signed(paths){
  paths = [...new Set((paths || []).filter(Boolean))];
  if (!paths.length) return {};
  const { data } = await sb.storage.from('photos').createSignedUrls(paths, 3600);
  const m = {};
  (data || []).forEach(x => { if (x.signedUrl) m[x.path] = x.signedUrl; });
  return m;
}
const removePhotos = async paths => { paths = (paths || []).filter(Boolean); if (paths.length) await sb.storage.from('photos').remove(paths); };

/* ---------- drobne narzędzia interfejsu ---------- */
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 4000);
}
function openModal(inner){
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = `<div class="modal">${inner}</div>`;
  document.body.appendChild(ov); document.body.style.overflow = 'hidden';
  const close = () => { ov.remove(); document.body.style.overflow = ''; };
  return { el: ov.firstElementChild, close };
}
function openLightbox(list, start){
  let idx = start;
  const lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = `<button class="x" aria-label="Zamknij">✕</button>${list.length > 1 ? '<button class="prev" aria-label="Poprzednie">‹</button><button class="next" aria-label="Następne">›</button>' : ''}<img alt="">`;
  const img = $('img', lb);
  const show = () => { img.src = list[idx]; };
  const close = () => { lb.remove(); document.removeEventListener('keydown', onKey); };
  const step = d => { idx = (idx + d + list.length) % list.length; show(); };
  const onKey = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft' && list.length > 1) step(-1); if (e.key === 'ArrowRight' && list.length > 1) step(1); };
  $('.x', lb).onclick = close;
  if (list.length > 1){ $('.prev', lb).onclick = () => step(-1); $('.next', lb).onclick = () => step(1); }
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(lb); show();
}
const rot = i => [-1.2, .8, -.5, 1.1, -.9, .4][i % 6];
const svgi = d => `<svg class="ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICON = {
  pen: svgi('<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>'),
  trash: svgi('<path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>'),
  back: svgi('<path d="M19 12H5"/><path d="m12 19-7-7 7-7"/>'),
  out: svgi('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>'),
  plus: svgi('<path d="M12 5v14M5 12h14"/>'),
  down: svgi('<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>'),
  up: svgi('<path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>'),
};

function shell(content){
  app.innerHTML = `
    <header class="top">
      <a class="brand hand" href="#/">${esc(CONFIG.TITLE)}</a>
      <div class="who"><button class="chip" id="chName" title="Zmień imię">${ICON.pen}${esc(author)}</button><button class="chip" id="logout">${ICON.out}Wyloguj</button></div>
    </header>
    <main class="wrap">${content}</main>`;
  $('#chName').onclick = () => askName(true);
  $('#logout').onclick = async () => { await sb.auth.signOut(); showLogin(); };
}

/* ---------- logowanie i imię ---------- */
function showSetupNeeded(){
  app.innerHTML = `<div class="center-card"><h1>Prawie gotowe</h1><p>W pliku <b>index.html</b> uzupełnij na górze sekcję <b>CONFIG</b> (adres i klucz z Supabase), zgodnie z instrukcją.</p></div>`;
}
function showLogin(){
  app.innerHTML = `
    <div class="center-card">
      <h1>${esc(CONFIG.TITLE)}</h1>
      <p class="muted">Wpisz hasło grupy, żeby wejść.</p>
      <form id="f">
        <input type="password" id="pw" placeholder="Hasło" autocomplete="current-password" autofocus>
        <div class="actions"><span class="status" id="st"></span><button class="btn" type="submit">Wejdź</button></div>
      </form>
    </div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const pw = $('#pw').value;
    if (!pw) return;
    $('#st').textContent = 'Sprawdzam…';
    const { error } = await sb.auth.signInWithPassword({ email: CONFIG.SHARED_EMAIL, password: pw });
    if (error) { $('#st').textContent = 'Nieprawidłowe hasło.'; return; }
    route();
  };
}
function askName(change = false){
  app.innerHTML = `
    <div class="center-card">
      <h1>${change ? 'Zmień imię' : 'Kim jesteś?'}</h1>
      <p class="muted">Pod tym imieniem będą podpisane Twoje wspomnienia. Każdy może poprawić cudzy wpis (np. błędną datę), ale usunąć wpis może tylko jego autor.</p>
      <form id="f">
        <input id="nm" maxlength="40" placeholder="Twoje imię lub ksywka" value="${esc(author)}" autofocus>
        <div class="actions">${change ? '<button class="btn ghost" type="button" id="cn">Anuluj</button>' : ''}<button class="btn" type="submit">Zapisz</button></div>
      </form>
    </div>`;
  if (change) $('#cn').onclick = route;
  $('#f').onsubmit = e => {
    e.preventDefault();
    const v = $('#nm').value.trim();
    if (!v) return;
    author = v;
    try { localStorage.setItem('pam_author', v); } catch (err) {}
    route();
  };
}

/* ---------- ekran główny: wyjazdy ---------- */
async function viewHome(){
  shell('<p class="hand big">Ładuję…</p>');
  const { data: trips, error } = await sb.from('trips').select('*').order('date_from', { ascending: tripsAsc });
  if (error) return shell(`<p class="err">Błąd: ${esc(error.message)}</p>`);
  const urls = await signed(trips.map(t => t.cover_path));
  const tiles = trips.map((t, i) => `
    <a class="tile" href="#/trip/${t.id}" style="--r:${rot(i)}deg">
      ${urls[t.cover_path] ? `<img class="cover" src="${urls[t.cover_path]}" alt="">` : `<div class="cover">${esc((t.name || '?').trim().charAt(0).toUpperCase())}</div>`}
      <h3>${esc(t.name)}</h3>
      <div class="sub">${esc(fmtRange(t.date_from, t.date_to, t.date_precision))}</div>
    </a>`).join('');
  shell(`
    <div class="bar">
      <button class="btn" id="addTrip">${ICON.plus}Nowy wyjazd</button>
      ${trips.length > 1 ? `<button class="chip big" id="sortT" title="Zmień kolejność" aria-label="Zmień kolejność">${tripsAsc ? ICON.down : ICON.up}<span class="lbl">${tripsAsc ? 'Najstarsze' : 'Najnowsze'}</span></button>` : ''}
    </div>
    ${trips.length ? `<div class="grid">${tiles}</div>` : '<div class="empty hand big">Nie ma jeszcze żadnego wyjazdu.<br>Dodaj pierwszy!</div>'}`);
  $('#addTrip').onclick = () => openTripModal(null);
  const s = $('#sortT'); if (s) s.onclick = () => { tripsAsc = !tripsAsc; viewHome(); };
}

function openTripModal(trip){
  const m = openModal(`
    <h2>${trip ? 'Edytuj wyjazd' : 'Nowy wyjazd'}</h2>
    <label>Nazwa wyjazdu<input id="tn" maxlength="80" placeholder="np. Chorwacja 2014" value="${esc(trip ? trip.name : '')}"></label>
    <div id="dp"></div>
    <label>Okładka (zdjęcie, opcjonalnie)<input type="file" id="cv" accept="image/*"></label>
    ${trip && trip.cover_path ? '<p class="muted" style="margin:4px 0 0;font-size:.85rem">Wybranie nowego zdjęcia zastąpi obecną okładkę.</p>' : ''}
    <div class="actions"><span class="status" id="st"></span><button class="btn ghost" id="cancel">Anuluj</button><button class="btn" id="save">Zapisz</button></div>`);
  const picker = makeDatePicker({ date: trip ? trip.date_from : todayStr(), end: trip ? trip.date_to : null, prec: trip ? trip.date_precision : 'day', withEnd: true });
  $('#dp', m.el).appendChild(picker.el);
  $('#cancel', m.el).onclick = m.close;
  $('#save', m.el).onclick = async () => {
    const name = $('#tn', m.el).value.trim();
    const d = picker.get();
    if (!name) return toast('Wpisz nazwę wyjazdu');
    if (!d.date) return toast('Wybierz datę wyjazdu');
    if (d.end && d.end < d.date) return toast('Data końca jest wcześniejsza niż początku');
    const btn = $('#save', m.el); btn.disabled = true;
    try {
      let cover_path = trip ? trip.cover_path : null;
      const f = $('#cv', m.el).files[0];
      if (f){
        $('#st', m.el).textContent = 'Wysyłam okładkę…';
        const np = await uploadImage(f, 'covers');
        if (cover_path) await removePhotos([cover_path]);
        cover_path = np;
      }
      const row = { name, date_from: d.date, date_to: d.end, date_precision: d.prec, cover_path };
      if (trip){
        if (author !== trip.created_by) row.edited_by = author;
        let { error } = await sb.from('trips').update(row).eq('id', trip.id);
        if (error && /edited_by/.test(error.message || '')){ delete row.edited_by; ({ error } = await sb.from('trips').update(row).eq('id', trip.id)); }
        if (error) throw error;
      }
      else { row.created_by = author; const { error } = await sb.from('trips').insert(row); if (error) throw error; }
      m.close(); route();
    } catch (err) { toast('Nie udało się zapisać: ' + (err.message || err)); btn.disabled = false; $('#st', m.el).textContent = ''; }
  };
}

/* ---------- widok wyjazdu: oś czasu ---------- */
async function viewTrip(id){
  shell('<p class="hand big">Ładuję…</p>');
  const [t, mm] = await Promise.all([
    sb.from('trips').select('*').eq('id', id).single(),
    sb.from('memories').select('*').eq('trip_id', id).order('event_date', { ascending: memAsc }).order('created_at', { ascending: true })
  ]);
  if (t.error || !t.data) return shell(`<a class="chip big back" href="#/">${ICON.back}wszystkie wyjazdy</a><p class="err">Nie znaleziono wyjazdu.</p>`);
  if (mm.error) return shell(`<p class="err">Błąd: ${esc(mm.error.message)}</p>`);
  const trip = t.data, mems = mm.data;
  const urls = await signed([trip.cover_path, ...mems.flatMap(x => x.photos || [])]);
  const mine = trip.created_by === author;

  let lastYear = null, html = '';
  mems.forEach((x, mi) => {
    const y = parts(x.event_date).y;
    if (y !== lastYear){ html += `<div class="year">${y}</div>`; lastYear = y; }
    const ph = (x.photos || []).filter(p => urls[p]);
    html += `
      <div class="entry">
        <div class="note">
          <div class="meta"><span class="date">${esc(fmtDate(x.event_date, x.date_precision))}</span><span class="by">${esc(x.author)}</span></div>
          ${x.edited_by ? `<div class="edited">poprawione przez ${esc(x.edited_by)}</div>` : ''}
          ${x.body ? `<p class="body">${esc(x.body)}</p>` : ''}
          ${ph.length ? `<div class="photos">${ph.map((p, i) => `<figure data-m="${mi}" data-i="${i}" style="--r:${rot(mi + i)}deg"><img src="${urls[p]}" loading="lazy" alt=""></figure>`).join('')}</div>` : ''}
          <div class="entry-actions"><button class="chip sm" data-edit="${mi}">${ICON.pen}edytuj</button>${x.author === author ? `<button class="chip sm danger" data-del="${mi}">${ICON.trash}usuń</button>` : ''}</div>
        </div>
      </div>`;
  });

  shell(`
    <a class="chip big back" href="#/">${ICON.back}wszystkie wyjazdy</a>
    <div class="trip-head">
      ${urls[trip.cover_path] ? `<img class="cover" src="${urls[trip.cover_path]}" alt="">` : ''}
      <div>
        <h1 class="hand"><span class="mk">${esc(trip.name)}</span></h1>
        <div class="sub"><span class="mk mk2">${esc(fmtRange(trip.date_from, trip.date_to, trip.date_precision))}</span></div>
        ${trip.edited_by ? `<div class="edited">poprawione przez ${esc(trip.edited_by)}</div>` : ''}
        <div class="trip-actions"><button class="chip" id="editTrip">${ICON.pen}edytuj wyjazd</button>${mine ? `<button class="chip danger" id="delTrip">${ICON.trash}usuń wyjazd</button>` : ''}</div>
      </div>
    </div>
    <div class="bar">
      <button class="btn" id="addMem">${ICON.plus}Dodaj wspomnienie</button>
      ${mems.length > 1 ? `<button class="chip big" id="sortM" title="Zmień kolejność" aria-label="Zmień kolejność">${memAsc ? ICON.down : ICON.up}<span class="lbl">${memAsc ? 'Najstarsze' : 'Najnowsze'}</span></button>` : ''}
    </div>
    ${mems.length ? `<div class="timeline">${html}</div>` : '<div class="empty hand big">Tu jeszcze pusto.<br>Dodaj pierwsze wspomnienie!</div>'}`);

  $('#addMem').onclick = () => openMemoryModal(trip, null, {});
  const s = $('#sortM'); if (s) s.onclick = () => { memAsc = !memAsc; viewTrip(id); };
  $('#editTrip').onclick = () => openTripModal(trip);
  if (mine) $('#delTrip').onclick = () => deleteTrip(trip, mems);
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const x = mems[+b.dataset.edit]; openMemoryModal(trip, x, urls); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteMemory(mems[+b.dataset.del]));
  app.querySelectorAll('.photos figure').forEach(f => f.onclick = () => {
    const x = mems[+f.dataset.m];
    const list = (x.photos || []).filter(p => urls[p]).map(p => urls[p]);
    openLightbox(list, +f.dataset.i);
  });
}

async function deleteMemory(mem){
  if (!confirm('Usunąć to wspomnienie razem ze zdjęciami?')) return;
  const { error } = await sb.from('memories').delete().eq('id', mem.id);
  if (error) return toast('Nie udało się usunąć: ' + error.message);
  await removePhotos(mem.photos);
  route();
}
async function deleteTrip(trip, mems){
  if (!confirm(`Usunąć wyjazd „${trip.name}” razem ze wszystkimi wspomnieniami i zdjęciami? Tego nie da się cofnąć.`)) return;
  const { error } = await sb.from('trips').delete().eq('id', trip.id);
  if (error) return toast('Nie udało się usunąć: ' + error.message);
  await removePhotos([trip.cover_path, ...mems.flatMap(x => x.photos || [])]);
  location.hash = '#/';
}

/* ---------- dodawanie / edycja wspomnienia ---------- */
function openMemoryModal(trip, mem, urls){
  const m = openModal(`
    <h2>${mem ? 'Edytuj wspomnienie' : 'Nowe wspomnienie'}</h2>
    <p class="muted" style="margin:0">${esc(trip.name)}</p>
    <div id="dp"></div>
    <label>Twoje wspomnienie<textarea id="tx" placeholder="Co pamiętasz z tego wyjazdu?"></textarea></label>
    <label>Zdjęcia</label>
    <div class="thumbs" id="th"></div>
    <input type="file" id="fl" accept="image/*" multiple style="margin-top:8px">
    <div class="actions"><span class="status" id="st"></span><button class="btn ghost" id="cancel">Anuluj</button><button class="btn" id="save">Zapisz</button></div>`);
  const picker = makeDatePicker({ date: mem ? mem.event_date : todayStr(), prec: mem ? mem.date_precision : 'day' });
  $('#dp', m.el).appendChild(picker.el);
  const tx = $('#tx', m.el); tx.value = mem ? (mem.body || '') : '';
  let keep = mem ? [...(mem.photos || [])] : [];
  let files = [];
  const th = $('#th', m.el);
  function paintThumbs(){
    th.innerHTML = '';
    keep.forEach((p, i) => {
      const d = document.createElement('div'); d.className = 'thumb';
      d.innerHTML = `<img src="${urls[p] || ''}" alt=""><button type="button" title="Usuń">✕</button>`;
      d.querySelector('button').onclick = () => { keep.splice(i, 1); paintThumbs(); };
      th.appendChild(d);
    });
    files.forEach((f, i) => {
      const d = document.createElement('div'); d.className = 'thumb';
      const u = URL.createObjectURL(f);
      d.innerHTML = `<img src="${u}" alt=""><button type="button" title="Usuń">✕</button>`;
      d.querySelector('button').onclick = () => { files.splice(i, 1); paintThumbs(); };
      th.appendChild(d);
    });
  }
  paintThumbs();
  $('#fl', m.el).onchange = e => { files.push(...Array.from(e.target.files)); e.target.value = ''; paintThumbs(); };
  $('#cancel', m.el).onclick = m.close;
  $('#save', m.el).onclick = async () => {
    const d = picker.get();
    const body = tx.value.trim();
    if (!d.date) return toast('Wybierz datę wspomnienia');
    if (!body && !keep.length && !files.length) return toast('Dodaj tekst albo zdjęcie');
    const btn = $('#save', m.el); btn.disabled = true;
    try {
      const uploaded = [];
      for (let i = 0; i < files.length; i++){
        $('#st', m.el).textContent = `Wysyłam zdjęcie ${i + 1} z ${files.length}…`;
        uploaded.push(await uploadImage(files[i], trip.id));
      }
      $('#st', m.el).textContent = 'Zapisuję…';
      const row = { trip_id: trip.id, author: mem ? mem.author : author, body, event_date: d.date, date_precision: d.prec, photos: [...keep, ...uploaded] };
      if (mem){
        row.updated_at = new Date().toISOString();
        if (author !== mem.author) row.edited_by = author;
        let { error } = await sb.from('memories').update(row).eq('id', mem.id);
        if (error && /edited_by/.test(error.message || '')){ delete row.edited_by; ({ error } = await sb.from('memories').update(row).eq('id', mem.id)); }
        if (error) throw error;
        await removePhotos((mem.photos || []).filter(p => !keep.includes(p)));
      } else {
        const { error } = await sb.from('memories').insert(row);
        if (error) throw error;
      }
      m.close(); route();
    } catch (err) { toast('Nie udało się zapisać: ' + (err.message || err)); btn.disabled = false; $('#st', m.el).textContent = ''; }
  };
}

/* ---------- start ---------- */
async function route(){
  if (notConfigured) return showSetupNeeded();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  if (!author) return askName();
  const m = location.hash.match(/^#\/trip\/([0-9a-fA-F-]+)/);
  if (m) viewTrip(m[1]); else viewHome();
}
window.addEventListener('hashchange', route);
route();
</script>
